    {cat:'read',type:'book',emoji:'📙',title:'人间失格',author:'太宰治',note:'生而为人，我很抱歉'},

    // --- PHOTOS (life / move) ---
    {cat:'life',type:'photo',src:'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=400&q=80',title:'Camp Night',sub:'星空下的帐篷'},
    {cat:'move',type:'photo',src:'https://images.unsplash.com/photo-1551632811-561732d1e306?w=400&q=80',title:'Trekking',sub:'云端之上的小路'},
    {cat:'life',type:'photo',src:'https://images.unsplash.com/photo-1563822249548-9a72b6353cd1?w=400&q=80',title:'Tea Fields',sub:'春天的味道'},
    {cat:'move',type:'photo',src:'https://images.unsplash.com/photo-1541625602330-2277a4c46182?w=400&q=80',title:'Cycling',sub:'风和自由的代名词'},
    {cat:'life',type:'photo',src:'https://images.unsplash.com/photo-1592419044706-39796d40f98c?w=400&q=80',title:'Garden',sub:'阳台上的小宇宙'},
  ];

  /* ============ RENDER HTML ============ */
  function cardHTML(d){
    switch(d.type){
      case 'quote': return `<div class="card-body"><div class="quote-tag">${d.tag}</div><div class="quote-text">${d.text}</div></div>`;
      case 'stat': return `<div class="card-body"><div class="stat-value" style="color:${d.color}">${d.value}<span class="stat-unit">${d.unit}</span></div><div class="stat-label">${d.label}</div></div>`;
      case 'moment': return `<div class="moment-visual">${d.emoji}</div><div class="moment-info"><div class="moment-title">${d.title}</div><div class="moment-desc">${d.desc}</div></div>`;
      case 'track': return `<div class="card-body"><div class="track-header"><span class="track-app">${d.app}</span><span class="track-time">${d.time}</span></div><div class="track-bars">${d.bars.map(b=>`<div class="track-bar"><div class="track-fill" style="width:${b.w}%;background:${b.c}"></div></div>`).join('')}</div><div class="track-name">${d.name}</div><div class="track-genre">${d.genre}</div></div>`;
      case 'tag': return `<div class="tag-dot" style="background:${d.dot}"></div><div class="tag-text">${d.text}</div>`;
      case 'book': return `<div class="card-body"><div class="book-emoji">${d.emoji}</div><div class="book-title">${d.title}</div><div class="book-author">${d.author}</div><div class="book-note">${d.note}</div></div>`;
      case 'photo': return `<img src="${d.src}" loading="lazy" alt="${d.title}"><div class="photo-caption"><div class="photo-title">${d.title}</div><div class="photo-sub">${d.sub}</div></div>`;
    }
  }

  /* ============ STREAM ENGINE ============ */
  const streamLayer=document.getElementById('streamLayer');
  const heroLayer=document.getElementById('heroLayer');
  const focusOverlay=document.getElementById('focusOverlay');
  const focusClone=document.getElementById('focusClone');

  let currentFilter='all';
  let liveCards=[];
  let focusOpen=false;
  let mouseX=0,mouseY=0;
  let cardIdCounter=0;

  /* Column layout for orderly, balanced distribution */
  const COLS=5;
  function getColX(col){
    const margin=0.04;
    const usable=1-margin*2;
    const colW=usable/COLS;
    return margin+colW*col+colW*0.5;
  }

  /* Pool: shuffled queue per column */
  let pools=[];
  function buildPools(){
    pools=[];
    const filtered=CARDS.filter(c=>currentFilter==='all'||c.cat===currentFilter);
    for(let i=0;i<COLS;i++){
      const p=[...filtered];
      /* shuffle */
      for(let j=p.length-1;j>0;j--){const k=RI(0,j+1);[p[j],p[k]]=[p[k],p[j]];}
      pools.push({items:p,idx:0});
    }
  }
  function nextFromPool(col){
    const p=pools[col];
    if(!p||p.items.length===0) return CARDS[RI(0,CARDS.length)];
    const item=p.items[p.idx % p.items.length];
    p.idx++;
    return item;
  }

  /* Spawn a card in given column */
  function spawnCard(col,immediate){
    const data=nextFromPool(col);
    const el=document.createElement('div');
    const typeClass='card-'+data.type;
    el.className=`stream-card ${typeClass}`;
    el.setAttribute('data-cat',data.cat);
    el.innerHTML=cardHTML(data);

    /* position */
    const xCenter=getColX(col);
    const xJitter=R(-.03,.03);
    const x=(xCenter+xJitter)*100;
    el.style.left=x+'%';
    el.style.transform='translateX(-50%)';

    /* depth layers: 0=far 1=near */
    const depth=R(0,1);
    const scale=.7+depth*.35;
    const speed=28+((1-depth)*30); /* 28-58s */
    const startY=immediate?R(0,100):105;

    const id=cardIdCounter++;
    const card={id,el,col,data,depth,scale,speed,y:startY,x,alive:true};
    liveCards.push(card);
    streamLayer.appendChild(el);

    /* click to focus */
    el.addEventListener('click',e=>{
      e.stopPropagation();
      openFocus(data,el);
    });

    return card;
  }

  /* ============ ANIMATION LOOP ============ */
  let lastT=0;
  function tick(t){
    if(!lastT)lastT=t;
    const dt=Math.min((t-lastT)/1000,0.1);
    lastT=t;

    /* parallax from mouse */
    const mx=(mouseX/W-0.5);
    const my=(mouseY/H-0.5);

    liveCards.forEach(c=>{
      if(!c.alive)return;
      /* move up */
      const pxPerSec=H/c.speed;
      c.y-=pxPerSec*dt/H*100;

      /* parallax */
      const px=mx*c.depth*25;
      const py=my*c.depth*15;

      c.el.style.transform=`translateX(-50%) translate(${px}px,${py}px) scale(${c.scale})`;
      c.el.style.top=c.y+'%';
      c.el.style.opacity=c.depth*.5+.45;

      /* remove if off screen */
      if(c.y<-20){
        c.alive=false;
        c.el.remove();
      }
    });

    /* clean dead */
    liveCards=liveCards.filter(c=>c.alive);

    /* ensure each column has enough cards */
    for(let col=0;col<COLS;col++){
      const colCards=liveCards.filter(c=>c.col===col);
      if(colCards.length<3){
        spawnCard(col,false);
      }
    }

    requestAnimationFrame(tick);
  }

  /* ============ FOCUS MODE ============ */
  function openFocus(data,srcEl){
    if(focusOpen)return;
    focusOpen=true;
    heroLayer.classList.add('dimmed');
    focusClone.className='focus-card-clone card-'+data.type;
    focusClone.innerHTML=cardHTML(data);
    focusOverlay.classList.add('active');
  }
  function closeFocus(){
    if(!focusOpen)return;
    focusOpen=false;
    focusOverlay.classList.remove('active');
    heroLayer.classList.remove('dimmed');
  }
  focusOverlay.addEventListener('click',closeFocus);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFocus()});

  /* ============ FILTER NAV ============ */
  document.querySelectorAll('.nav-pill').forEach(pill=>{
    pill.addEventListener('click',()=>{
      document.querySelectorAll('.nav-pill').forEach(p=>p.classList.remove('active'));
      pill.classList.add('active');
      currentFilter=pill.getAttribute('data-filter');

      /* rebuild */
      buildPools();
      /* fade out old cards quickly */
      liveCards.forEach(c=>{
        c.el.style.transition='opacity .5s ease';
        c.el.style.opacity='0';
        setTimeout(()=>{c.alive=false;c.el.remove()},500);
      });
      liveCards=[];
      /* spawn new set */
      setTimeout(()=>{
        for(let col=0;col<COLS;col++){
          for(let i=0;i<3;i++) spawnCard(col,true);
        }
      },300);
    });
  });

  /* ============ MOUSE TRACK ============ */
  document.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});
  /* Touch */
  document.addEventListener('touchmove',e=>{
    if(e.touches.length){mouseX=e.touches[0].clientX;mouseY=e.touches[0].clientY}
  },{passive:true});

  /* ============ INIT ============ */
  buildPools();
  for(let col=0;col<COLS;col++){
    for(let i=0;i<3;i++) spawnCard(col,true);
  }
  requestAnimationFrame(tick);

})();
</script>
