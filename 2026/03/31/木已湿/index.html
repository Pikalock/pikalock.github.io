<p>又一年春，提笔却已廖无言。</p>
</blockquote>
<p>初辞<br>芦湾浅水泊孤舟，朽木单薄不知愁。<br>偏羡云边飞鸟尽，欲凭短楫向沧洲。</p>
<p>夜泊<br>身似不系舟，随波任去留。<br>寒星垂大野，冷月照孤洲。<br>宿鸟惊残梦，芦花暗客愁。<br>明朝何处去，江海一轻鸥。</p>
